name: Refresh Economy Command Center

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "auto-data.js"
      - ".github/workflows/refresh-dashboard.yml"
  schedule:
    - cron: "0 7 * * *"
      timezone: "America/New_York"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wire dashboard to repository data
        run: python scripts/patch_dashboard.py

      - name: Refresh economy, rates and futures
        run: python scripts/update_data.py

      - name: Refresh economic calendar
        run: python scripts/update_calendar.py

      - name: Build offline snapshot
        run: python scripts/build_offline.py

      - name: Commit generated dashboard data
        shell: bash
        run: |
          git config user.name "economy-command-center-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html data offline
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "chore: refresh dashboard data"
            git push
          fi
