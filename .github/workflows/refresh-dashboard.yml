name: Refresh Economy Command Center

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"
      timezone: "America/New_York"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh public economy and market data
        run: python scripts/update_data.py

      - name: Build offline snapshot
        run: python scripts/build_offline.py

      - name: Commit changed data
        shell: bash
        run: |
          git config user.name "economy-command-center-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data offline
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: refresh dashboard data"
            git push
          fi
